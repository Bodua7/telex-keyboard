name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ ! -d VietnameseTelexKeyboard ]; then
            zipfile=$(ls *.zip | head -n1)
            unzip -o -q "$zipfile" -d .
          fi

      - name: Ensure build.gradle is pinned correctly
        run: |
          GRADLE_FILE="VietnameseTelexKeyboard/app/build.gradle"
          sed -i 's/compileSdk 34/compileSdk 33/' "$GRADLE_FILE"
          sed -i 's/targetSdk 34/targetSdk 33/' "$GRADLE_FILE"
          sed -i '/buildToolsVersion "34.0.0"/d' "$GRADLE_FILE"
          sed -i "s/androidx.core:core-ktx:1.12.0/androidx.core:core-ktx:1.10.1/" "$GRADLE_FILE"
          echo "----- android block -----"
          sed -n '1,15p' "$GRADLE_FILE"
          echo "----- dependencies -----"
          grep -A5 "^dependencies" "$GRADLE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper (if missing)
        working-directory: VietnameseTelexKeyboard
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type all
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: VietnameseTelexKeyboard
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VietnameseTelexKeyboard/app/build/outputs/apk/debug/app-debug.apk
