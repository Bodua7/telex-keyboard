name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ ! -d VietnameseTelexKeyboard ]; then
            zipfile=$(ls *.zip | head -n1)
            unzip -o -q "$zipfile" -d .
          fi

      - name: Ensure buildToolsVersion is pinned
        run: |
          GRADLE_FILE="VietnameseTelexKeyboard/app/build.gradle"
          if ! grep -q "buildToolsVersion" "$GRADLE_FILE"; then
            sed -i '/compileSdk 34/a\    buildToolsVersion "34.0.0"' "$GRADLE_FILE"
          fi
          echo "----- android block -----"
          sed -n '1,10p' "$GRADLE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install matching SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: VietnameseTelexKeyboard
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VietnameseTelexKeyboard/app/build/outputs/apk/debug/app-debug.apk
