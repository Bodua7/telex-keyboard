name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (always overwrite)
        run: |
          zipfile=$(ls *.zip | head -n1)
          rm -rf VietnameseTelexKeyboard
          unzip -o -q "$zipfile" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Generate Gradle Wrapper (if missing)
        working-directory: VietnameseTelexKeyboard
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type all
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: VietnameseTelexKeyboard
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: VietnameseTelexKeyboard/app/build/outputs/apk/debug/app-debug.apk
